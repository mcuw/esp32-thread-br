name: Build and Release Firmware

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node: [24.19]
        experimental: [false]
    name: 👷 CI Node-${{ matrix.node }} under ${{ matrix.os }}

    steps:
      # https://github.com/actions/checkout
      - name: Checkout Projekt-Repo
        uses: actions/checkout@v7


      # --- Build Frontend at first ---
      - name: Setp pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Frontend-Dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: web
        run: pnpm build

      - name: Check LittleFS-Partitions-size
        working-directory: web
        run: |
          SIZE=$(du -sb dist | cut -f1)
          LIMIT=$((2 * 1024 * 1024))  # 2 MB, eure littlefs-Partitionsgröße
          echo "Frontend-Build: $((SIZE / 1024)) KB / $((LIMIT / 1024)) KB"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Frontend-Build (${SIZE} Byte) überschreitet die littlefs-Partition (${LIMIT} Byte)!"
            exit 1
          fi


      #
      # --- Build Firmware (automatically bind web/dist over littlefs_create_partition_image)

      # https://github.com/actions/cache
      - name: Cache ESP-IDF Preview
        uses: actions/cache@v6
        with:
          path: ~/esp-idf-preview
          key: esp-idf-preview-102122904ad

      - name: Clone ESP-IDF Preview (if not in Cache)
        run: |
          if [ ! -d ~/esp-idf-preview/.git ]; then
            git clone --recursive https://github.com/espressif/esp-idf.git ~/esp-idf-preview
            cd ~/esp-idf-preview
            git checkout 102122904ad
            git submodule update --init --recursive
          fi

      - name: Install Toolchain
        run: |
          cd ~/esp-idf-preview
          ./install.sh esp32s31

      - name: Build firmware
        run: |
          . ~/esp-idf-preview/export.sh
          cd ot_br
          idf.py --preview set-target esp32s31
          idf.py build -D PROJECT_VER=${GITHUB_REF_NAME}

      - name: Rename Artifacts
        run: |
          cd ot_br/build
          cp esp_ot_br.bin ../../esp_ot_br-${GITHUB_REF_NAME}.bin
          cp bootloader/bootloader.bin ../../bootloader-${GITHUB_REF_NAME}.bin
          cp partition_table/partition-table.bin ../../partition-table-${GITHUB_REF_NAME}.bin
          cp littlefs.bin ../../littlefs-${GITHUB_REF_NAME}.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            esp_ot_br-${{ github.ref_name }}.bin
            bootloader-${{ github.ref_name }}.bin
            partition-table-${{ github.ref_name }}.bin
            littlefs-${{ github.ref_name }}.bin
          generate_release_notes: true