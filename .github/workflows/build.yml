name: Check build

permissions:
  contents: read

on: ["pull_request", "workflow_call"]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        node: [24.19]
        experimental: [false]
    name: 📋 CI ESP-IDF + Node-${{ matrix.node }} under ${{ matrix.os }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: Setp pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🎉 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: ✨ Install Frontend-dependencies
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: ✅ Check code style
        working-directory: web
        run: pnpm check

      - name: Build Frontend
        working-directory: web
        run: pnpm build

      - name: Check LittleFS-Partitions-size
        working-directory: web
        run: |
          SIZE=$(du -sb dist | cut -f1)
          LIMIT=$((2 * 1024 * 1024))  # 2 MB, eure littlefs-Partitionsgröße
          echo "Frontend-Build: $((SIZE / 1024)) KB / $((LIMIT / 1024)) KB"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Frontend-Build (${SIZE} Byte) does not fit into littlefs-Partition (${LIMIT} Byte)!"
            exit 1
          fi

      #
      # --- Build Firmware (automatically bind web/dist over littlefs_create_partition_image)
      #

      # https://github.com/actions/cache
      - name: Cache ESP-IDF Preview
        uses: actions/cache@v6
        with:
          path: ~/esp-idf-preview
          key: esp-idf-preview-102122904ad

      - name: Clone ESP-IDF Preview (if not in Cache)
        run: |
          if [ ! -d ~/esp-idf-preview/.git ]; then
            git clone --recursive https://github.com/espressif/esp-idf.git ~/esp-idf-preview
            cd ~/esp-idf-preview
            git checkout 102122904ad
            git submodule update --init --recursive
          fi

      - name: Install Toolchain
        run: |
          cd ~/esp-idf-preview
          ./install.sh esp32s31

      - name: Build firmware
        run: |
          . ~/esp-idf-preview/export.sh
          cd ot_br
          idf.py --preview set-target esp32s31
          idf.py build
